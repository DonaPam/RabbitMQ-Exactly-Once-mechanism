services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_broker
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rabbitmq_network

  writer:
    build: ./writer
    container_name: exactly_once_writer
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - WRITER_ID=1
    networks:
      - rabbitmq_network

  reader1:
    build: ./reader
    container_name: exactly_once_reader1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - READER_ID=1
    networks:
      - rabbitmq_network

  reader2:
    build: ./reader
    container_name: exactly_once_reader2
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - READER_ID=2
    networks:
      - rabbitmq_network

networks:
  rabbitmq_network:
    driver: bridge